databases:
  - name: propertease-db
    plan: free
    databaseName: propertease
    user: propertease

services:
  - type: web
    name: propertease
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Occuplace
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://propertease-wv4j.onrender.com
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: propertease-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Occuplace
      # Render's filesystem is ephemeral: local uploads vanish on every
      # deploy. Switch these to media_s3 / sensitive_s3 once a bucket exists.
      - key: MEDIA_DISK
        value: media
      - key: SENSITIVE_DISK
        value: sensitive
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: MEDIA_BUCKET
        sync: false
      - key: SENSITIVE_BUCKET
        sync: false
      - key: MEDIA_URL
        sync: false
