# Documentation of the production setup. Render's Blueprint for this repo was
# DISCONNECTED on 2026-09-24, so pushing changes here does not change Render.
# The live service (occuplace) was created by hand and its environment
# variables are managed in the Render dashboard. Keep this file in step with
# the dashboard so the setup can be recreated. The database and file storage
# live in Supabase, not on Render.

services:
  - type: web
    name: occuplace
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Occuplace
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://occuplace.onrender.com
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # The app uses a Supabase Postgres, not a Render database. Set DB_URL by
      # hand to the Supabase *Session pooler* string (port 5432, user
      # postgres.<project-ref>). Never the direct or transaction pooler string.
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Occuplace
      # Render's filesystem is ephemeral, so uploads live in Supabase Storage
      # (S3 API). occuplace-media is a public bucket for listing photos and
      # payment QR codes; occuplace-sensitive is private, for IDs and payment
      # proofs. The keys, endpoint and MEDIA_URL are set by hand in the dashboard.
      - key: MEDIA_DISK
        value: media_s3
      - key: SENSITIVE_DISK
        value: sensitive_s3
      - key: AWS_DEFAULT_REGION
        value: us-west-2
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: MEDIA_BUCKET
        sync: false
      - key: SENSITIVE_BUCKET
        sync: false
      - key: MEDIA_URL
        sync: false
